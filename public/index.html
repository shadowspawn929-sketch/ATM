<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>ALUCARD AI — Image Generator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <div class="brand-name">ALUCARD</div>
        <div class="brand-subtitle">AI IMAGE GENERATOR</div>
      </div>
    </div>
    <div class="status"><span class="status-dot"></span> SYSTEM READY</div>
  </header>

  <main class="app-shell">
    <section id="chat" class="chat" aria-live="polite"></section>

    <div id="typing" class="typing hidden">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-text">ALUCARD is generating artwork...</span>
    </div>

    <form id="chatForm" class="input-area">
      <textarea
        id="messageInput"
        rows="1"
        maxlength="2000"
        placeholder="Describe an image..."
        aria-label="Describe an image"
        autocomplete="off"
      ></textarea>
      <button id="sendBtn" type="submit" aria-label="Generate image">➤</button>
    </form>

    <div class="bottom-actions">
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <footer>
      ALUCARD AI can make mistakes. Check important information.
    </footer>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
